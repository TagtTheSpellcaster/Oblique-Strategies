<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oblique Strategies / Strategie Oblique</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            cursor: pointer;
        }

        header {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 10;
        }

        .lang-switch {
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: #444444;
            display: flex;
            gap: 0.5rem;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #555555;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 400;
            padding: 0;
            outline: none;
            transition: color 0.2s ease;
        }

        .lang-btn:hover {
            color: #888888;
        }

        .lang-btn.active {
            color: #ffffff;
            font-weight: 600;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 2rem;
            text-align: center;
        }

        .strategy {
            font-size: clamp(1.4rem, 3.5vw, 2.8rem);
            font-weight: 300;
            line-height: 1.4;
            letter-spacing: -0.01em;
            max-width: 900px;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .strategy.visible {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <header>
        <div class="lang-switch" onclick="event.stopPropagation()">
            <button id="btn-en" class="lang-btn active" onclick="setLanguage('en')">EN</button>
            <span>|</span>
            <button id="btn-it" class="lang-btn" onclick="setLanguage('it')">IT</button>
        </div>
    </header>

    <main>
        <div id="text" class="strategy"></div>
    </main>

            {

                it: "A cosa stai pensando veramente proprio ora? Incorporalo."

            {

                it: "Dov'è la semplicità?"

            {

                it: "Cosa farebbe il tuo migliore amico?"

                it: "Quale sarebbe stato il tuo errore?"

            {

                it: "Non devi vergognarti di usare le tue idee."

        const textEl = document.getElementById('text');
        const btnEn = document.getElementById('btn-en');
        const btnIt = document.getElementById('btn-it');
        
        let currentLang = 'en';
        let currentIndex = -1;

        function setLanguage(lang) {
            if (currentLang === lang) return;
            currentLang = lang;

            btnEn.classList.toggle('active', lang === 'en');
            btnIt.classList.toggle('active', lang === 'it');

            if (currentIndex !== -1) {
                textEl.classList.remove('visible');
                setTimeout(() => {
                    textEl.innerText = strategies[currentIndex][currentLang];
                    textEl.classList.add('visible');
                }, 300);
            }
        }

        function nextStrategy() {
            textEl.classList.remove('visible');

            setTimeout(() => {
                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * strategies.length);
                } while (nextIndex === currentIndex && strategies.length > 1);

                currentIndex = nextIndex;
                textEl.innerText = strategies[currentIndex][currentLang];
                textEl.classList.add('visible');
            }, 300);
        }

        document.body.addEventListener('click', nextStrategy);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                nextStrategy();
            }
        });

        // Estrazione iniziale all'avvio
        window.addEventListener('DOMContentLoaded', nextStrategy);
    </script>
</body>
</html>
